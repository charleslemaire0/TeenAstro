name: Firmware Uploader Release

on:
  push:
    tags:
      - 'v*'   # e.g. v1.6.0, v1.6.1

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build TeenAstro Firmware Uploader
        working-directory: TeenAstroUploader/python
        run: |
          python -m pip install -r requirements-dev.txt
          python -m PyInstaller --noconfirm packaging/TeenAstroUploader.spec

      - name: Package uploader
        run: |
          mkdir dist
          xcopy "TeenAstroUploader\python\dist\TeenAstroUploader" "dist\uploader" /E /I /Y
          copy /Y "TeenAstroUploader\TeenAstroUploader\teensy.exe" "dist\uploader"
          copy /Y "TeenAstroUploader\TeenAstroUploader\teensy_post_compile.exe" "dist\uploader"
          copy /Y "TeenAstroUploader\TeenAstroUploader\teensy_reboot.exe" "dist\uploader"
          copy /Y "TeenAstroUploader\TeenAstroUploader\teensy_restart.exe" "dist\uploader"
          copy /Y "TeenAstroUploader\TeenAstroUploader\teensy_gateway.exe" "dist\uploader"
          copy /Y "TeenAstroUploader\TeenAstroUploader\esptool.exe" "dist\uploader"
          powershell -Command "Compress-Archive -Path 'dist/uploader/*' -DestinationPath 'dist/TeenAstroUploader.zip' -Force"

      - name: Upload artifact (optional, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: TeenAstroUploader
          path: dist/TeenAstroUploader.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TeenAstroUploader.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
