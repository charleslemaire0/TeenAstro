; PlatformIO Project Configuration File for TeenAstro SHC
;
; Defines the different board combinations

[platformio]
; Uncomment this line to build just one version, comment it to build all
; Default remains the Wemos D1 Mini (ESP8266) language variants.
default_envs = ENGLISH
lib_dir = ../libraries
src_dir = .
build_dir = .pio


; Shared by every board.  Keep MCU-specific options out of [env] so they
; cannot leak into a different architecture.
[env]
framework = arduino
extra_scripts = pre:rename_shc.py
custom_option1 = 166


; -----------------------------------------------------------------------------
; Wemos D1 Mini (ESP8266) — production SHC
; -----------------------------------------------------------------------------
[wemos]
platform = espressif8266@3.2.0
board = d1_mini
board_build.f_cpu = 160000000L
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.4m1m.ld
upload_speed = 115200
upload_port = COM4
lib_ldf_mode = chain+
lib_ignore = TeenAstroAlpaca

[env:ENGLISH]
extends = wemos
build_flags = -DLANGUAGE=ENGLISH

[env:GERMAN]
extends = wemos
build_flags = -DLANGUAGE=GERMAN

[env:FRENCH]
extends = wemos
build_flags = -DLANGUAGE=FRENCH


; -----------------------------------------------------------------------------
; LOLIN S3 Mini SHC — same PCB as the Wemos D1 Mini.
; Alpaca (ASCOM REST on TCP/11111 + UDP/32227 discovery) is enabled here;
; the ESP8266 envs still ignore it because 1M flash has no room.
; Build: pio run -d TeenAstroSHC -e esp32s3
; -----------------------------------------------------------------------------
[shc_esp32s3]
platform = espressif32
board = lolin_s3_mini
upload_speed = 921600
upload_port = COM9
board_upload.use_1200bps_touch = false
board_upload.wait_for_upload_port = false
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = chain+
lib_deps = TeenAstroAlpaca
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DSHC_HAS_ALPACA

[env:esp32s3]
extends = shc_esp32s3
build_flags = ${shc_esp32s3.build_flags} -DLANGUAGE=ENGLISH

[env:esp32s3_GERMAN]
extends = shc_esp32s3
build_flags = ${shc_esp32s3.build_flags} -DLANGUAGE=GERMAN

[env:esp32s3_FRENCH]
extends = shc_esp32s3
build_flags = ${shc_esp32s3.build_flags} -DLANGUAGE=FRENCH


; -----------------------------------------------------------------------------
; LilyGO T-Display S3 — path A: U8g2 128×64 FB blit to ST7789 170×320 color TFT.
; No button pad (B_PIN* = -1). Flash over USB CDC.
; Build: pio run -d TeenAstroSHC -e tdisplay_s3
; Upload: pio run -d TeenAstroSHC -e tdisplay_s3 -t upload
; -----------------------------------------------------------------------------
[env:tdisplay_s3]
platform = espressif32
board = lilygo-t-display-s3
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = chain+
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	TeenAstroAlpaca
lib_ignore =
build_unflags =
	-DARDUINO_USB_MODE=1
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DSHC_TDISPLAY_S3
	-DSHC_HAS_ALPACA
	-DLANGUAGE=ENGLISH
	-DUSER_SETUP_LOADED=1
	-DST7789_DRIVER=1
	-DINIT_SEQUENCE_3=1
	-DCGRAM_OFFSET=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_ON=1
	-DTFT_PARALLEL_8_BIT=1
	-DTFT_WIDTH=170
	-DTFT_HEIGHT=320
	-DTFT_CS=6
	-DTFT_DC=7
	-DTFT_RST=5
	-DTFT_WR=8
	-DTFT_RD=9
	-DTFT_D0=39
	-DTFT_D1=40
	-DTFT_D2=41
	-DTFT_D3=42
	-DTFT_D4=45
	-DTFT_D5=46
	-DTFT_D6=47
	-DTFT_D7=48
	-DTFT_BL=38
	-DTFT_BACKLIGHT_ON=HIGH
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DSMOOTH_FONT=1
